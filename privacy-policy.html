<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سياسة الخصوصية — NEXORA</title>
    <meta name="description" content="سياسة خصوصية لعبة NEXORA — الرابط الدائم للصفحة.">
    <!-- The policy itself lives in nexora/, the folder-per-app shape this
         repository uses. This file exists so that .../privacy-policy.html also
         resolves, for listings that were already given that address. -->
    <link rel="canonical" href="nexora/">
    <meta http-equiv="refresh" content="0; url=nexora/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0D0D;
            color: #E0E0E0;
            line-height: 1.8;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        a { color: #D4A843; }
    </style>
    <script>
        // <meta refresh> covers every browser; this keeps the history clean.
        location.replace('nexora/');
    </script>
</head>
<body>
    <p>صفحة سياسة خصوصية <strong>NEXORA</strong> انتقلت إلى:</p>
    <p><a href="nexora/">nexora/</a></p>

</body>
</html>
